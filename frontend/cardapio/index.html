<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Hambúrguer do Ben - Cardápio Digital</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Bebas+Neue&family=Oswald:wght@400;700&family=Righteous&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

        <link rel="stylesheet" href="styles/global.css">
        <link rel="stylesheet" href="styles/layout.css">
        <link rel="stylesheet" href="styles/components.css">
    </head>

    <body>
        <header class="header">
            <div class="container header__interno">
                <a href="/" class="header__marca" aria-label="Hambúrguer do Ben - Início">
                    <img 
                        src="img/hamburguer-do-ben.png" 
                        alt="Logo Hambúrguer do Ben" 
                        class="header__logo-img"
                    />
                    <div class="header__textos">
                        <h1 class="header__logo">Hambúrguer do Ben</h1>
                        <p class="header__slogan">O sabor que fica na memória</p>
                    </div>
                </a>
            </div>
        </header>

        <main class="main container">
            <nav class="filtros">
                <button class="botao-filtro ativo" data-category="all">Todos</button>
                <button class="botao-filtro" data-category="hamburguer">Hambúrgueres</button>
                <button class="botao-filtro" data-category="acompanhamento">Acompanhamentos</button>
                <button class="botao-filtro" data-category="bebida">Bebidas</button>
                <button class="botao-filtro" data-category="sobremesa">Sobremesas</button>
            </nav>

            <section class="menu">
                <h2 class="menu__titulo">Nosso Cardápio</h2>
                <div class="menu__grid" id="menuGrid">
                    <!-- ITENS INSERIDOS VIA JAVASCRIPT -->
                </div>
            </section>
        </main>

        <footer class="footer">
            <div class="container footer__interno">
                <div class="footer__coluna">
                    <h4 class="footer__titulo">Endereço</h4>
                    <p class="footer__item">
                        <i class="fa-solid fa-location-dot" aria-hidden="true"></i>
                        <span>Rua dos Sigmas Boys, 67 - Centro, Brasília - DF</span>
                    </p>
                </div>

                <div class="footer__coluna">
                    <h4 class="footer__titulo">Contato</h4>
                    <a class="footer__item" href="https://wa.me/5511999999999" target="_blank" rel="noopener">
                        <i class="fa-brands fa-whatsapp" aria-hidden="true"></i>
                        <span>(11) 99999-9999</span>
                    </a>
                    <a class="footer__item" href="mailto:contato@hamburguerdoben.com.br">
                        <i class="fa-solid fa-envelope" aria-hidden="true"></i>
                        <span>contato@hamburguerdoben.com.br</span>
                    </a>
                </div>

                <div class="footer__coluna">
                    <h4 class="footer__titulo">Funcionamento</h4>
                    <p class="footer__item">
                        <i class="fa-solid fa-clock" aria-hidden="true"></i>
                        <span>Ter a Dom - 18h às 23h</span>
                    </p>
                </div>

                <div class="footer__coluna">
                    <h4 class="footer__titulo">Redes Sociais</h4>
                    <div class="footer__redes">
                        <a href="https://instagram.com/hamburguerdoben" target="_blank" rel="noopener" aria-label="Instagram">
                            <i class="fa-brands fa-instagram" aria-hidden="true"></i>
                        </a>
                        <a href="https://facebook.com/hamburguerdoben" target="_blank" rel="noopener" aria-label="Facebook">
                            <i class="fa-brands fa-facebook" aria-hidden="true"></i>
                        </a>
                        <a href="https://tiktok.com/@hamburguerdoben" target="_blank" rel="noopener" aria-label="TikTok">
                            <i class="fa-brands fa-tiktok" aria-hidden="true"></i>
                        </a>
                    </div>
                </div>
            </div>

            <div class="footer__base">
                <p>&copy; 2026 Hambúrguer do Ben - Todos os direitos reservados.</p>
            </div>
        </footer>

        <script src="scripts/main.js"></script>
    </body>
</html>
